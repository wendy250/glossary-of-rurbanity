<style>
:root{
  --ground:#f5edf7;
  --surface:#faf5fb;
  --surface-2:#f1e6f4;

  --ink:#3a2044;

  --ink-faint:#ab8bb2;

  --land-hi:#c47fd0;

@media (prefers-color-scheme: dark){

    --ground:#1d1424;
    --surface:#241a2e;
    --surface-2:#2e2138;
    --surface-border:#4a3455;
    --ink:#f5e6f7;
    --ink-soft:#c6a6cf;
    --ink-faint:#8a6d92;
    --land:#4a2f57;
    --land-hi:#7d4a8f;
    --land-line:#6b4a78;
    --water:#140d1a;
    --accent:#e0a0ee;
    --accent-ink:#f6dcf9;
    --accent-2:#b48fd6;
    --accent-2-soft:#9c7fc2;
    --shadow:0 10px 34px -12px rgba(0,0,0,0.6);
    --focus:#e0a0ee;
    --surface-glass:rgba(36,26,46,0.90);
    --water-glass:rgba(20,13,26,0.55);
    --land-glass:rgba(74,47,87,0.82);
    --land-hi-glass:rgba(125,74,143,0.85);
    --bg-image-opacity:0.18;
    --bm-relief-filter:brightness(.62) saturate(.9);
    --bm-coast:#8a6a9c;
    --bm-water:#ff6b5f;

}
:root[data-theme="dark"]{
  --ground:#1d1424;

  --accent-2:#b48fd6;

}

  background-position:center;
  background-repeat:no-repeat;
  opacity:var(--bg-image-opacity);
  z-index:0;
  pointer-events:none;
}
.app{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-rows:auto 1fr;
  height:100vh;
}

/* ---------- header ---------- */
header.bar{
  display:flex;
  align-items:center;
  gap:20px;
  padding:12px 20px;
  background:var(--surface-glass);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--surface-border);
  z-index:20;
}
.wordmark{
  display:flex;
  align-items:baseline;
  gap:9px;
  flex-shrink:0;
}
.wordmark .glyph{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:0.01em;
  white-space:nowrap;
}
@media(max-width:560px){ .wordmark .glyph{ font-size:17px; } }
.wordmark .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.09em;
  color:var(--ink-faint);
  white-space:nowrap;
}
.stat-strip{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:var(--ink-soft);
  letter-spacing:0.02em;
  white-space:nowrap;
  display:none;
}
@media(min-width:760px){ .stat-strip{ display:block; } }
.search-wrap{
  margin-left:auto;
  position:relative;
  flex:1;
  max-width:360px;
  min-width:120px;
}
.search-wrap input{
  width:100%;
  font-family:'Work Sans', sans-serif;
  font-size:13.5px;
  padding:8px 12px 8px 30px;
  border-radius:3px;
  border:1px solid var(--surface-border);
  background:var(--ground);
  color:var(--ink);
  outline:none;
}
.search-wrap input:focus{ border-color:var(--focus); box-shadow:0 0 0 2px color-mix(in srgb, var(--focus) 25%, transparent); }
.search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint); pointer-events:none; }
.panel-toggle{
  display:none;
  border:1px solid var(--surface-border);
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.06em;
  padding:8px 11px;
  border-radius:3px;
  cursor:pointer;
  flex-shrink:0;
}
@media(max-width:820px){ .panel-toggle{ display:inline-flex; align-items:center; gap:6px; order:2; margin-left:auto; } }
@media(max-width:560px){
  header.bar{ flex-wrap:wrap; row-gap:8px; }
  .wordmark{ order:1; }
  .search-wrap{ order:3; flex-basis:100%; max-width:none; margin-left:0; }
  .wordmark .tag{ display:none; }
}

/* ---------- layout ---------- */
.layout{
  position:relative;
  display:grid;
  grid-template-columns:1fr 360px;
  min-height:0;
}
@media(max-width:820px){
  .layout{ grid-template-columns:1fr; }
}

/* ---------- map ---------- */
.map-viewport{
  position:relative;
  overflow:hidden;
  background:var(--water-glass);
  cursor:grab;
  touch-action:none;
}
.map-viewport.dragging{ cursor:grabbing; }
.map-world{
  position:absolute;
  top:0; left:0;
  width:1000px;
  height:486.72px;
  transform-origin:0 0;
}
.map-world svg{ display:block; width:1000px; height:486.72px; }
.map-world .basemap-img{ pointer-events:none; filter:var(--bm-relief-filter, none); }
.map-world .bm-coast{ fill:none; stroke:var(--bm-coast); stroke-width:calc(0.6 * var(--bm-ms, 1)); opacity:.8; pointer-events:none; }
.map-world .bm-lakes{ fill:var(--bm-water); stroke:none; pointer-events:none; }
.map-world .bm-rivers{ fill:none; stroke:var(--bm-water); stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.map-world .bm-rivers.major{ stroke-width:calc(0.9 * var(--bm-ms, 1)); opacity:.85; }
.map-world .bm-rivers.minor{ stroke-width:calc(0.5 * var(--bm-ms, 1)); opacity:.6; }
.markers-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.marker{
  position:absolute;
  transform:translate(-50%,-100%);
  pointer-events:auto;
  cursor:pointer;
  z-index:5;
  background:none;
  border:none;
  padding:0;
}
.marker-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  transform:scale(var(--ms,1));
  transform-origin:50% 100%;
}
.marker .pin-line{
  width:1px;
  height:9px;
  background:var(--accent-ink);
  opacity:.75;
}
.marker .tag-box{
  font-family:'Noto Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans Khmer','Noto Sans Armenian','Noto Sans Tamil','Noto Sans Kannada','Noto Sans Devanagari','Work Sans',sans-serif;
  font-size:11px;
  font-weight:500;
  line-height:1.15;
  color:var(--accent-ink);
  background:var(--surface);
  border:1px solid var(--accent);
  border-radius:2px;
  padding:2.5px 6px;
  white-space:nowrap;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 2px 6px -2px rgba(0,0,0,0.35);
  transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
}
.marker:hover, .marker:focus-visible, .marker.proximity-top{
  z-index:999;
}
.marker.active{
  z-index:998;
}
/* Hover / proximity-precision: brings the label to front and shows its
   full text, but stays visually "preview" (light fill) so it's never
   mistaken for an actually-selected (.active) term. */
.marker:hover .tag-box, .marker:focus-visible .tag-box, .marker.proximity-top .tag-box{
  background:var(--surface);
  border-color:var(--accent-ink);
  color:var(--accent-ink);
  transform:translateY(-1px);
  box-shadow:0 4px 10px -3px rgba(0,0,0,0.45);
  max-width:none;
  overflow:visible;
}
/* Active (actually selected / open in the detail panel): the only state
   that gets the solid filled look. */
.marker.active .tag-box{
  background:var(--accent);
  color:#fff9ee;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
}
.marker.active:hover .tag-box, .marker.active.proximity-top .tag-box{
  background:var(--accent);
  color:#fff9ee;
}
.marker:focus-visible{ outline:none; }
.marker:focus-visible .tag-box{ box-shadow:0 0 0 3px var(--focus); }

/* map controls */
.map-controls{
  position:absolute;
  right:14px;
  bottom:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:15;
}
.map-controls button{
  width:30px; height:30px;
  border-radius:3px;
  border:1px solid var(--surface-border);
  background:var(--surface);
  color:var(--ink);
  font-size:16px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
}
.map-controls button:hover{ background:var(--surface-2); }
.map-controls .reset{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.04em; width:auto; padding:0 8px; }


/* ---------- side panel ---------- */
.panel{
  background:var(--surface-glass);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-left:1px solid var(--surface-border);
  display:flex;
  flex-direction:column;
  min-height:0;
  z-index:10;
}
@media(max-width:820px){
  .panel{
    position:absolute;
    inset:0 0 0 auto;
    width:min(360px,88vw);
    transform:translateX(100%);
    transition:transform .28s ease;
    box-shadow:var(--shadow);
  }
  .panel.open{ transform:translateX(0); }
}

.panel-head{
  padding:14px 16px 10px;
  border-bottom:1px solid var(--surface-border);
  flex-shrink:0;
}
.panel-head .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.panel-head h2{
  margin:3px 0 0;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:18px;
}

<script>
(function(){
  var MAP = JSON.parse(document.getElementById('mapData').textContent);
  var ENTRIES = window.GLOSSARY_ENTRIES;
  var W = MAP.width, H = MAP.height;

  var located = ENTRIES.filter(function(e){ return !e.unlocated; });
  var unlocated = ENTRIES.filter(function(e){ return e.unlocated; });

  // ---- stats ----
  var countrySet = {};
  located.forEach(function(e){ if(e.country) countrySet[e.country]=1; });
  var countryCount = Object.keys(countrySet).length;
  document.getElementById('statStrip').textContent = ENTRIES.length + ' terms · ' + countryCount + ' places · ' + (new Set(ENTRIES.map(function(e){return e.contributor;}))).size + ' contributors';

  // ---- basemap ----
  // Drawn basemap (no administrative boundaries), in the same Equal Earth
  // frame as project() below:
  //  - basemap/relief.webp: elevation tint + hillshade, rendered from AWS
  //    Terrain Tiles and coloured after the original basemap_1014 photo;
  //  - basemap/vectors.js: Natural Earth coastline, lakes and rivers as
  //    paths with hairline strokes, so they stay sharp at any zoom. (Clipping
  //    the relief image to the land path looked crisper but made every
  //    zoom/pan repaint take seconds, so the coastline is stroked instead.)
  var SVGNS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('baseSvg');
  var V = window.BASEMAP_VECTORS || {};
  function el(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    for(var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  svg.appendChild(el('image', { 'class': 'basemap-img', x: 0, y: 0, width: W, height: H,
    preserveAspectRatio: 'none', href: 'basemap/relief.webp' }));
  svg.appendChild(el('path', { 'class': 'bm-coast', d: V.land || '' }));
  svg.appendChild(el('path', { 'class': 'bm-lakes', d: V.lakes || '' }));
  svg.appendChild(el('path', { 'class': 'bm-rivers minor', d: V.rivers_minor || '' }));
  svg.appendChild(el('path', { 'class': 'bm-rivers major', d: V.rivers_major || '' }));

  // Equal Earth projection (Savric/Jenny/Jenny 2018) -- an equal-area
  // pseudocylindrical projection, used here instead of Mercator per the UN's
  // 2024 "Correct The Map" call to stop defaulting world maps to Mercator,
  // whose inflation of high-latitude landmasses (e.g. Africa appearing
  // smaller than Greenland) misrepresents relative country sizes.
  var EQ_A1 = 1.340264, EQ_A2 = -0.081106, EQ_A3 = 0.000893, EQ_A4 = 0.003796;
  var EQ_SQRT3 = Math.sqrt(3);
  var EQ_XMAX = (2 * EQ_SQRT3 * Math.PI) / (3 * EQ_A1);
  var EQ_YMAX = (function(){
    var th = Math.asin(EQ_SQRT3 / 2);
    var t2 = th*th;
    return th * (EQ_A1 + EQ_A2*t2 + EQ_A3*Math.pow(t2,3) + EQ_A4*Math.pow(t2,4));
  })();
  var EQ_SCALE = W / (2 * EQ_XMAX);
  function project(lat, lon){
    var phi = lat * Math.PI / 180, lambda = lon * Math.PI / 180;
    var theta = Math.asin((EQ_SQRT3 / 2) * Math.sin(phi));
    var t2 = theta*theta, t6 = Math.pow(theta,6), t8 = Math.pow(theta,8);
    var xEq = (2 * EQ_SQRT3 * lambda * Math.cos(theta)) / (3 * (9*EQ_A4*t8 + 7*EQ_A3*t6 + 3*EQ_A2*t2 + EQ_A1));
    var yEq = theta * (EQ_A1 + EQ_A2*t2 + EQ_A3*t6 + EQ_A4*t8);
    var x = (xEq + EQ_XMAX) * EQ_SCALE;
    var y = (EQ_YMAX - yEq) * EQ_SCALE;
    return { x: x, y: y };
  }

  // ---- pan / zoom state ----
  var viewport = document.getElementById('mapViewport');
  var world = document.getElementById('mapWorld');
  var scale = 1, tx = 0, ty = 0;
  var minScale = 1, maxScale = 36;

  var INITIAL_ZOOM_BOOST = 1.18; // fill more of the viewport on first load instead of a fully letterboxed fit
  function fitToViewport(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var s = Math.min(vw / W, vh / H);
    minScale = s;
    scale = s * INITIAL_ZOOM_BOOST;
    tx = (vw - W*scale)/2;
    ty = (vh - H*scale)/2;
    apply();
  }

  function clampPan(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var mw = W*scale, mh = H*scale;
    var minTx = Math.min(0, vw-mw), maxTx = Math.max(0, vw-mw);
    var minTy = Math.min(0, vh-mh), maxTy = Math.max(0, vh-mh);
    if(mw <= vw){ tx = (vw-mw)/2; } else { tx = Math.max(minTx, Math.min(maxTx, tx)); }
    if(mh <= vh){ ty = (vh-mh)/2; } else { ty = Math.max(minTy, Math.min(maxTy, ty)); }
  }

  function apply(){
    clampPan();
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    document.documentElement.style.setProperty('--ms', (1/scale).toFixed(4));
    layoutClusters();
    // Basemap hairlines/dots are resized only once a zoom settles: restyling
    // the large coastline/river paths on every wheel frame would stall it.
    clearTimeout(bmStrokeTimer);
    bmStrokeTimer = setTimeout(function(){
      svg.style.setProperty('--bm-ms', (1/scale).toFixed(4));
    }, 160);
  }
  var bmStrokeTimer = null;

  function zoomAt(cx, cy, factor){
    var newScale = Math.max(minScale, Math.min(maxScale, scale*factor));
    if(newScale === scale) return;
    var wx = (cx - tx)/scale, wy = (cy - ty)/scale;
    tx = cx - wx*newScale;
    ty = cy - wy*newScale;
    scale = newScale;
    apply();
  }

  // Promote to a GPU layer only while an actual gesture is running, and drop
  // it once things settle, so Chrome/Edge re-rasterize the map at full
  // resolution when idle instead of leaving a stale low-res cached texture
  // scaled up (see the .map-world CSS comment above for the full story).
  var wheelSettleTimer = null;
  viewport.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var rect = viewport.getBoundingClientRect();
    var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    var factor = Math.pow(1.0025, -ev.deltaY);
    world.style.willChange = 'transform';
    zoomAt(cx, cy, factor);
    clearTimeout(wheelSettleTimer);
    wheelSettleTimer = setTimeout(function(){ world.style.willChange = 'auto'; }, 180);
  }, { passive:false });

  var dragging = false, dragStartX=0, dragStartY=0, txStart=0, tyStart=0, moved=false;
  function pointerDown(x,y){
    dragging = true; moved=false;
    dragStartX = x; dragStartY = y; txStart = tx; tyStart = ty;
    viewport.classList.add('dragging');
    world.style.willChange = 'transform';
  }
  function pointerMove(x,y){
    if(!dragging) return;
    var dx = x-dragStartX, dy = y-dragStartY;
    if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
    tx = txStart+dx; ty = tyStart+dy;
    apply();
  }
  function pointerUp(){
    dragging = false;
    viewport.classList.remove('dragging');
    world.style.willChange = 'auto';
  }
  viewport.addEventListener('mousedown', function(ev){ pointerDown(ev.clientX, ev.clientY); });
  window.addEventListener('mousemove', function(ev){ pointerMove(ev.clientX, ev.clientY); });
  window.addEventListener('mouseup', pointerUp);
  viewport.addEventListener('touchstart', function(ev){
    if(ev.touches.length===1){ pointerDown(ev.touches[0].clientX, ev.touches[0].clientY); }
    else if(ev.touches.length===2){ dragging=false; pinchStart(ev); }
  }, { passive:true });
  viewport.addEventListener('touchmove', function(ev){
    if(ev.touches.length===1){ pointerMove(ev.touches[0].clientX, ev.touches[0].clientY); }
    else if(ev.touches.length===2){ pinchMove(ev); }
  }, { passive:true });
  viewport.addEventListener('touchend', function(){ pointerUp(); pinchActive=false; });

  var pinchActive=false, pinchDist0=0, pinchScale0=1;
  function dist(t0,t1){ var dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY; return Math.sqrt(dx*dx+dy*dy); }
  function pinchStart(ev){
    pinchActive = true;
    pinchDist0 = dist(ev.touches[0], ev.touches[1]);
    pinchScale0 = scale;
    world.style.willChange = 'transform';
  }
  function pinchMove(ev){
    if(!pinchActive) return;
    var d = dist(ev.touches[0], ev.touches[1]);
    var rect = viewport.getBoundingClientRect();
    var cx = (ev.touches[0].clientX+ev.touches[1].clientX)/2 - rect.left;
    var cy = (ev.touches[0].clientY+ev.touches[1].clientY)/2 - rect.top;
    var target = pinchScale0 * (d/pinchDist0);
    zoomAt(cx, cy, target/scale);
  }

  document.getElementById('zoomIn').addEventListener('click', function(){
    zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.6);
  });
  document.getElementById('zoomOut').addEventListener('click', function(){
    zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.6);
  });
  document.getElementById('zoomReset').addEventListener('click', function(){ fitToViewport(); });

  viewport.addEventListener('dblclick', function(ev){
    var rect = viewport.getBoundingClientRect();
    zoomAt(ev.clientX-rect.left, ev.clientY-rect.top, 1.8);
  });

  // ---- markers ----
  // Entries that share (near-)identical coordinates would otherwise stack
  // perfectly and hide/steal each other's click target, so fan them out in
  // a small deterministic spiral (in map-unit space, so the offset reads
  // small when zoomed out and proportionally larger once zoomed in).
  // A term can carry extra_locations ([{lat, lon, label}]) besides its main
  // lat/lon; every location gets its own pin, all opening the same term.
  function locationsOf(e){
    return [{ lat: e.lat, lon: e.lon, label: e.location_label }].concat(e.extra_locations || []);
  }
  var pins = [];
  located.forEach(function(e){
    locationsOf(e).forEach(function(loc, idx){
      pins.push({ e: e, idx: idx, lat: loc.lat, lon: loc.lon, key: e.id + ':' + idx });
    });
  });
  var coordGroups = {};
  pins.forEach(function(pin){
    var key = pin.lat.toFixed(2) + ',' + pin.lon.toFixed(2);
    (coordGroups[key] = coordGroups[key] || []).push(pin);
  });
  // Once zoomed in, a spiral still leaves labels overlapping (e.g. 8 terms on
  // one Jakarta point), so each cluster blends from the spiral into a tidy
  // vertical stack in *screen* pixels -- one label per row, the first one's
  // pin on the true location -- making every term individually clickable.
  var jitterFor = {};
  Object.keys(coordGroups).forEach(function(key){
    var group = coordGroups[key];
    if(group.length < 2) return;
    var GOLDEN_ANGLE = 137.508 * Math.PI / 180;
    group.forEach(function(pin, i){
      var r = 1.6 * Math.sqrt(i);
      var a = i * GOLDEN_ANGLE;
      jitterFor[pin.key] = { dx: r * Math.cos(a), dy: r * Math.sin(a), row: i };
    });
  });

  var STACK_ROW_PX = 28;           // label height + pin line
  var STACK_FROM = 2, STACK_TO = 4.5; // zoom (relative to fit) where stacking starts / completes (flyTo lands at 4.5)
  var clustered = [];
  function layoutClusters(){
    if(!clustered.length) return;
    var z = scale / minScale;
    var f = Math.max(0, Math.min(1, (z - STACK_FROM) / (STACK_TO - STACK_FROM)));
    clustered.forEach(function(c){
      var j = c.j;
      var dx = j.dx * (1 - f);
      var dy = j.dy * (1 - f) - f * j.row * STACK_ROW_PX / scale;
      c.el.style.left = (c.x + dx) + 'px';
      c.el.style.top = (c.y + dy) + 'px';
    });
  }

  var markerEls = {};   // term id -> array of its pin elements
  var markersLayer = document.getElementById('markersLayer');
  pins.forEach(function(pin){
    var e = pin.e;
    var p = project(pin.lat, pin.lon);
    var j = jitterFor[pin.key];
    var x = p.x + (j ? j.dx : 0);
    var y = p.y + (j ? j.dy : 0);
    var m = document.createElement('button');
    if(j) clustered.push({ el: m, x: p.x, y: p.y, j: j });
    m.type = 'button';
    m.className = 'marker';
    m.style.left = x + 'px';
    m.style.top = y + 'px';
    m.innerHTML = '<span class="marker-inner"><span class="tag-box">'+escapeHtml(e.original)+'</span><span class="pin-line"></span></span>';
    m.dataset.id = e.id;
    m.dataset.loc = pin.idx;
    markersLayer.appendChild(m);
    (markerEls[e.id] = markerEls[e.id] || []).push(m);
  });
  function setActiveMarkers(id){
    Object.keys(markerEls).forEach(function(k){
      markerEls[k].forEach(function(m){ m.classList.toggle('active', +k === id); });
    });
  }

  // ---- precise targeting for overlapping markers (shared by hover + click) ----
  // When many labels crowd together, the browser's default hit-test only
  // ever reaches whichever box happens to be topmost in paint order, even
  // if the cursor is really closest to a different (partly hidden) label's
  // anchor point. elementsFromPoint returns every marker whose box covers
  // the cursor (not just the visible one), so we resolve the one whose pin
  // actually sits nearest the cursor and use that SAME resolution for both
  // the hover preview and the click, so what you see highlighted is always
  // exactly what you'll open.
  var MAX_DIST_SQ = 160*160; // ignore candidates whose anchor is too far to be a plausible target
  function resolveMarkerAt(clientX, clientY){
    var stack = document.elementsFromPoint(clientX, clientY);
    var candidates = [];
    for(var i=0;i<stack.length;i++){
      var el = stack[i].closest ? stack[i].closest('.marker') : null;
      if(el && candidates.indexOf(el) === -1) candidates.push(el);
    }
    var best = null, bestDist = Infinity;
    candidates.forEach(function(el){
      var r = el.getBoundingClientRect();
      var ax = r.left + r.width/2, ay = r.bottom;
      var dx = clientX - ax, dy = clientY - ay;
      var d = dx*dx + dy*dy;
      if(d < bestDist && d <= MAX_DIST_SQ){ bestDist = d; best = el; }
    });
    return best;
  }
  var proximityTopEl = null;
  function clearProximityTop(){
    if(proximityTopEl){ proximityTopEl.classList.remove('proximity-top'); proximityTopEl = null; }
  }
  function updateProximityTop(clientX, clientY){
    var best = resolveMarkerAt(clientX, clientY);
    if(best !== proximityTopEl){
      clearProximityTop();
      if(best){ best.classList.add('proximity-top'); proximityTopEl = best; }
    }
  }
  markersLayer.addEventListener('pointermove', function(ev){
    updateProximityTop(ev.clientX, ev.clientY);
  });
  markersLayer.addEventListener('pointerleave', clearProximityTop);
  viewport.addEventListener('pointerleave', clearProximityTop);

  // Click routing uses the exact same nearest-anchor resolution as hover
  // (falling back to whatever the browser's native hit-test found, e.g. for
  // touch taps that never fired a pointermove), so the term that opens is
  // always the one that was actually shown highlighted.
  markersLayer.addEventListener('click', function(ev){
    var resolved = resolveMarkerAt(ev.clientX, ev.clientY) ||
      (ev.target.closest ? ev.target.closest('.marker') : null);
    if(resolved && resolved.dataset.id !== undefined){
      var clickedId = parseInt(resolved.dataset.id, 10);
      if(clickedId === activeId){
        closeDetail();
      } else {
        selectEntry(clickedId, parseInt(resolved.dataset.loc || '0', 10));
      }
    }
  });

  function escapeHtml(s){
    if(s==null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---- side panel: list ----
  var listView = document.getElementById('listView');
  var detailView = document.getElementById('detailView');
  var panelTitle = document.getElementById('panelTitle');
  var panelEyebrow = document.getElementById('panelEyebrow');
  var searchInput = document.getElementById('searchInput');

  function metaLine(e){
    var bits = [];
    if(e.country) bits.push(e.country);
    if(e.contributor) bits.push(e.contributor);
    return bits.join(' <span class="dot">·</span> ');
  }

  function renderList(query){
    query = (query||'').trim().toLowerCase();
    function matches(e){
      if(!query) return true;
      var hay = [e.original,e.transliteration,e.meaning,e.where,e.country,e.contributor,
        e.keyword_raw,e.literally_raw,e.where_raw,e.scale_raw,e.condition_raw,e.design_response_raw
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.indexOf(query) !== -1;
    }
    var rows = [];
    var filteredUnlocated = unlocated.filter(matches);
    var filteredLocated = located.filter(matches);

    if(filteredUnlocated.length){
      rows.push('<div class="section-label">Non-geographic</div>');
      filteredUnlocated.forEach(function(e){ rows.push(rowHtml(e)); });
    }
    rows.push('<div class="section-label">On the map (' + filteredLocated.length + ')</div>');
    if(!filteredLocated.length && !filteredUnlocated.length){
      listView.innerHTML = '<div class="empty-state">No terms match “' + escapeHtml(query) + '”.</div>';
      return;
    }
    filteredLocated.forEach(function(e){ rows.push(rowHtml(e)); });
    listView.innerHTML = rows.join('');
    listView.querySelectorAll('.entry-row').forEach(function(btn){
      btn.addEventListener('click', function(){ selectEntry(parseInt(btn.dataset.id,10)); });
    });
  }

  function rowHtml(e){
    return '<button type="button" class="entry-row" data-id="'+e.id+'">'+
      '<span class="orig">'+escapeHtml(e.original)+'</span>'+
      '<span class="meta">'+metaLine(e)+'</span>'+
      '</button>';
  }

  // Typing (or even just focusing) the search box while a term detail is open
  // switches the panel back to the list so the results are actually visible --
  // otherwise the list was being filtered behind the still-showing detail view.
  function showSearchableList(){
    if(detailView.style.display !== 'none') closeDetail();
  }
  searchInput.addEventListener('focus', showSearchableList);
  searchInput.addEventListener('input', function(){
    showSearchableList();
    renderList(searchInput.value);
  });

  // ---- detail ----
  var activeId = null;
  function selectEntry(id, locIdx){
    activeId = id;
    locIdx = locIdx || 0;
    var e = ENTRIES[id];
    listView.style.display = 'none';
    detailView.style.display = 'block';
    panelEyebrow.textContent = e.unlocated ? 'Non-geographic term' : (e.country||'');
    panelTitle.textContent = 'Term detail';

    setActiveMarkers(id);

    function block(label, text, extraClass){
      if(!text) return '';
      return '<div class="detail-block"><div class="k">'+escapeHtml(label)+'</div><div class="v'+(extraClass?' '+extraClass:'')+'">'+escapeHtml(text)+'</div></div>';
    }

    var html = '';
    html += '<button type="button" class="detail-back" id="detailBack">← Back to index</button>';
    // Every term has its own page: the title links to term.html (full text + images).
    html += '<a class="detail-orig detail-orig-link" href="term.html?id='+e.id+'">'+escapeHtml(e.original)+'<span class="go" aria-hidden="true"> ↗</span></a>';
    if(e.transliteration) html += '<div class="detail-translit">'+escapeHtml(e.transliteration)+'</div>';
    if(e.country) html += '<div class="detail-country">'+escapeHtml(e.country)+'</div>';

    // 词语（各种语言版本）Keyword, in whatever language versions the source gave
    html += block('Keyword', e.keyword_raw || e.original, 'keyword-block');
    // Literally
    html += block('Literally', e.literally_raw || e.meaning);
    // Where
    html += block('Where', e.where_raw || e.where);
    // Scale
    html += block('Scale', e.scale_raw || e.scale);
    // Condition
    html += block('Condition', e.condition_raw);
    // Design response
    html += block('Design response', e.design_response_raw);
    // Reference
    html += block('Reference', e.references_raw, 'refs');

    html += '<div class="detail-contributor"><div class="k">Contributed by</div><div class="name">'+escapeHtml(e.contributor||'—')+'</div></div>';
    var locs = e.unlocated ? [] : locationsOf(e);
    locs.forEach(function(loc, i){
      var label = locs.length > 1 ? '◎ ' + (loc.label || ('Location ' + (i+1))) : '◎ Locate on map';
      html += '<button type="button" class="detail-locate" data-loc="'+i+'">'+escapeHtml(label)+'</button>';
    });
    if(!e.source_path){
      html += '<div class="detail-source-note">Full source text unavailable for this entry — showing what was recorded during picking.</div>';
    }
    detailView.innerHTML = html;

    document.getElementById('detailBack').addEventListener('click', closeDetail);
    detailView.querySelectorAll('.detail-locate').forEach(function(btn){
      btn.addEventListener('click', function(){ flyTo(locs[+btn.dataset.loc]); });
    });

    if(!e.unlocated) flyTo(locs[locIdx] || locs[0]);
    if(window.innerWidth <= 820) openPanel();
  }

  function closeDetail(){
    activeId = null;
    setActiveMarkers(null);
    detailView.style.display = 'none';
    listView.style.display = 'block';
    panelEyebrow.textContent = 'Index';
    panelTitle.textContent = 'All terms';
  }

  function flyTo(loc){
    var p = project(loc.lat, loc.lon);
    var targetScale = Math.max(scale, minScale*4.5);
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    scale = Math.min(maxScale, targetScale);
    tx = vw/2 - p.x*scale;
    ty = vh/2 - p.y*scale + vh*0.12;
    apply();
  }

  // ---- responsive panel toggle (mobile) ----
  var panel = document.getElementById('panel');
  var panelToggle = document.getElementById('panelToggle');
  function openPanel(){ panel.classList.add('open'); }
  function closePanel(){ panel.classList.remove('open'); }
  panelToggle.addEventListener('click', function(){
    panel.classList.contains('open') ? closePanel() : openPanel();
  });

  window.addEventListener('resize', fitToViewport);

  renderList('');
  fitToViewport();

  // term.html links back here as index.html#term=<id> to reopen that term.
  var hashMatch = /^#term=(\d+)$/.exec(location.hash);
  if(hashMatch && ENTRIES[+hashMatch[1]]) selectEntry(+hashMatch[1]);
})();
</script>
