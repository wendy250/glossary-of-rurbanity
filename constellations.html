<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellations · Glossary of Rurbanity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Same palette as the atlas (index.html) so the pages read as one site. */
:root{
  --ground:#f5edf7;
  --surface:#faf5fb;
  --surface-2:#f1e6f4;
  --surface-border:#e6cfe9;
  --ink:#3a2044;
  --ink-soft:#7c5a86;
  --ink-faint:#ab8bb2;
  --accent:#b34fc9;
  --accent-ink:#7a2f8a;
  --accent-2:#8a5cb8;
  --accent-2-soft:#a37cc9;
  --on-accent:#fff9ee;
  --surface-glass:rgba(250,245,251,0.90);
  --sky:#2c1a36;
  --sky-2:#3a2447;
  --star:#f6dcf9;
  --star-line:rgba(224,160,238,0.55);
  --term-font:'Noto Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans Bengali','Noto Sans Devanagari','Work Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1d1424;
    --surface:#241a2e;
    --surface-2:#2e2138;
    --surface-border:#4a3455;
    --ink:#f5e6f7;
    --ink-soft:#c6a6cf;
    --ink-faint:#8a6d92;
    --accent:#e0a0ee;
    --accent-ink:#f6dcf9;
    --accent-2:#b48fd6;
    --accent-2-soft:#9c7fc2;
    --on-accent:#1d1424;
    --surface-glass:rgba(36,26,46,0.90);
    --sky:#140d1a;
    --sky-2:#211629;
  }
}
:root[data-theme="dark"]{
  --ground:#1d1424;
  --surface:#241a2e;
  --surface-2:#2e2138;
  --surface-border:#4a3455;
  --ink:#f5e6f7;
  --ink-soft:#c6a6cf;
  --ink-faint:#8a6d92;
  --accent:#e0a0ee;
  --accent-ink:#f6dcf9;
  --accent-2:#b48fd6;
  --accent-2-soft:#9c7fc2;
  --on-accent:#1d1424;
  --surface-glass:rgba(36,26,46,0.90);
  --sky:#140d1a;
  --sky-2:#211629;
}

*{ box-sizing:border-box; }
body{ margin:0; background:var(--ground); color:var(--ink); font-family:'Work Sans','Noto Sans',sans-serif; }
button{ font:inherit; }

/* ---------- header (matches the atlas bar) ---------- */
header.bar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:20px;
  padding:12px 20px;
  background:var(--surface-glass);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--surface-border);
}
.wordmark{ display:flex; align-items:baseline; gap:9px; text-decoration:none; color:var(--ink); min-width:0; }
.wordmark .glyph{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; white-space:nowrap; }
.wordmark .tag{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); white-space:nowrap; }
.site-nav{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
.site-nav a{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); text-decoration:none; padding:6px 9px; border-radius:3px; border:1px solid transparent; white-space:nowrap; }
.site-nav a:hover{ color:var(--ink); background:color-mix(in srgb, var(--accent-2) 10%, transparent); }
.site-nav a[aria-current="page"]{ color:var(--accent-ink); background:var(--surface); border-color:var(--surface-border); }
@media(max-width:620px){
  header.bar{ flex-wrap:wrap; row-gap:8px; }
  .wordmark .glyph{ font-size:17px; }
  .wordmark .tag{ display:none; }
  .site-nav{ flex-basis:100%; }
}

/* ---------- stepper ---------- */
main{ max-width:1180px; margin:0 auto; padding:28px 20px 120px; }
.intro .eyebrow, .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-faint); }
.intro h1{ margin:8px 0 0; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,5vw,46px); line-height:1.12; }
.intro p{ margin:10px 0 0; max-width:680px; font-size:16px; line-height:1.6; color:var(--ink-soft); }

.steps{ list-style:none; margin:26px 0 0; padding:0; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
.steps button{
  width:100%; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--surface-border); border-radius:4px;
  padding:10px 12px; color:var(--ink-soft);
  display:flex; flex-direction:column; gap:3px; min-height:58px;
}
.steps button .n{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); }
.steps button .t{ font-size:13.5px; font-weight:500; line-height:1.25; }
.steps button[aria-current="step"]{ background:var(--accent-2); border-color:var(--accent-2); color:var(--on-accent); }
.steps button[aria-current="step"] .n{ color:var(--on-accent); opacity:.8; }
.steps button.done .n::after{ content:" ✓"; }
.steps button:disabled{ cursor:not-allowed; opacity:.5; }
@media(max-width:720px){
  .steps{ grid-template-columns:repeat(5,1fr); }
  .steps button{ min-height:0; padding:8px; align-items:center; text-align:center; }
  .steps button .t{ display:none; }
}

.panel{ margin-top:22px; background:var(--surface); border:1px solid var(--surface-border); border-radius:6px; padding:22px; }
.panel h2{ margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:24px; }
.guide{ margin:8px 0 0; font-size:15px; line-height:1.6; color:var(--ink-soft); max-width:760px; }
.guide b{ color:var(--ink); font-weight:600; }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
  padding:9px 14px; border-radius:3px; border:1px solid var(--accent-2-soft);
  background:var(--surface); color:var(--accent-2); text-decoration:none;
}
.btn:hover{ background:color-mix(in srgb, var(--accent-2) 10%, var(--surface)); }
.btn.primary{ background:var(--accent-2); border-color:var(--accent-2); color:var(--on-accent); }
.btn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.small{ padding:6px 10px; font-size:10.5px; }
.btn.ghost{ border-color:transparent; }

/* sticky step footer */
.stepbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  background:var(--surface-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-top:1px solid var(--surface-border);
}
.stepbar .inner{ max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px; }
.stepbar .status{ font-size:13.5px; color:var(--ink-soft); flex:1; min-width:0; }
.stepbar .status b{ color:var(--ink); }

/* ---------- step 1: pick words ---------- */
.pick-tools{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px; }
.search{ position:relative; flex:1; min-width:220px; max-width:420px; }
.search input{
  width:100%; font:inherit; font-size:14px; padding:9px 12px 9px 32px; border-radius:3px;
  border:1px solid var(--surface-border); background:var(--ground); color:var(--ink); outline:none;
}
.search input:focus{ border-color:var(--accent-2); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent-2) 25%, transparent); }
.search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint); }
.toggle{ font-size:13px; color:var(--ink-soft); display:inline-flex; gap:6px; align-items:center; cursor:pointer; }

.term-grid{ margin-top:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:8px; }
.term-card{
  position:relative; text-align:left; cursor:pointer;
  background:var(--ground); border:1px solid var(--surface-border); border-radius:4px;
  padding:11px 34px 11px 12px; color:var(--ink); min-height:74px;
  display:flex; flex-direction:column; gap:3px;
}
.term-card:hover{ border-color:var(--accent-2-soft); }
.term-card .o{ font-family:var(--term-font); font-weight:600; font-size:15.5px; line-height:1.25; word-break:break-word; }
.term-card .tr{ font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--ink-soft); }
.term-card .c{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-top:auto; }
.term-card .check{
  position:absolute; top:9px; right:9px; width:18px; height:18px; border-radius:50%;
  border:1.5px solid var(--accent-2-soft); display:grid; place-items:center; font-size:11px; color:transparent;
}
.term-card[aria-pressed="true"]{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 12%, var(--surface)); }
.term-card[aria-pressed="true"] .check{ background:var(--accent-2); border-color:var(--accent-2); color:var(--on-accent); }
.term-card .open{ position:absolute; right:9px; bottom:8px; font-size:12px; color:var(--ink-faint); text-decoration:none; padding:2px 4px; }
.term-card .open:hover{ color:var(--accent-2); }
.more-row{ margin-top:14px; text-align:center; }
.empty{ padding:30px 0; text-align:center; color:var(--ink-faint); }

/* ---------- step 2: groups ---------- */
.group-list{ margin-top:18px; display:grid; gap:10px; }
.group-row{ display:grid; grid-template-columns:28px 1fr 1.4fr 34px; gap:8px; align-items:start; background:var(--ground); border:1px solid var(--surface-border); border-radius:4px; padding:10px; }
.group-row .dot{ width:14px; height:14px; border-radius:50%; margin:11px 0 0 6px; }
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); }
.field input, .field textarea{
  font:inherit; font-size:14.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--surface-border); border-radius:3px; padding:8px 10px; outline:none; width:100%;
}
.field textarea{ resize:vertical; min-height:64px; line-height:1.5; }
.field input:focus, .field textarea:focus{ border-color:var(--accent-2); }
.icon-btn{ width:30px; height:30px; margin-top:20px; border-radius:3px; border:1px solid transparent; background:none; color:var(--ink-faint); cursor:pointer; font-size:18px; line-height:1; }
.icon-btn:hover{ color:var(--accent-ink); border-color:var(--surface-border); }
@media(max-width:700px){ .group-row{ grid-template-columns:22px 1fr 32px; } .group-row .field.q{ grid-column:2 / 3; } }
.inspo{ margin-top:22px; }
.inspo .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip{
  cursor:pointer; text-align:left; font-size:13px; line-height:1.35; color:var(--ink);
  background:var(--ground); border:1px dashed var(--accent-2-soft); border-radius:3px; padding:7px 10px; max-width:340px;
}
.chip small{ display:block; color:var(--ink-soft); font-size:12px; margin-top:2px; }
.chip:hover{ border-style:solid; }
.chip:disabled{ opacity:.45; cursor:default; }

/* ---------- step 3: sorting ---------- */
.sort{ margin-top:18px; display:grid; grid-template-columns:minmax(220px, 300px) 1fr; gap:16px; align-items:start; }
@media(max-width:820px){ .sort{ grid-template-columns:1fr; } }
.tray, .bucket{ border:1px solid var(--surface-border); border-radius:5px; background:var(--ground); padding:12px; }
.tray{ position:sticky; top:84px; }
.tray h3, .bucket h3{ margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.bucket h3 .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.bucket .q{ margin:3px 0 0; font-size:12.5px; color:var(--ink-soft); font-style:italic; }
.buckets{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.dropzone{ margin-top:10px; min-height:62px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; border-radius:4px; padding:6px; border:1.5px dashed transparent; transition:background .12s, border-color .12s; }
.dropzone.empty-hint::before{ content:attr(data-hint); color:var(--ink-faint); font-size:12.5px; padding:6px; }
.dropzone.over, .bucket.target .dropzone{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 8%, transparent); }
.bucket.target{ cursor:pointer; }
.word{
  cursor:grab; user-select:none; touch-action:none;
  font-family:var(--term-font); font-size:13.5px; font-weight:500;
  background:var(--surface); color:var(--accent-ink); border:1px solid var(--accent-2-soft); border-radius:3px;
  padding:5px 8px; display:inline-flex; align-items:center; gap:6px; max-width:100%;
}
.word .x{ border:none; background:none; color:var(--ink-faint); cursor:pointer; padding:0 0 0 2px; font-size:14px; line-height:1; }
.word .x:hover{ color:var(--accent-ink); }
.word.selected{ background:var(--accent-2); color:var(--on-accent); border-color:var(--accent-2); }
.word.dragging{ opacity:.35; }
.drag-ghost{ position:fixed; z-index:100; pointer-events:none; transform:translate(-50%,-50%) rotate(-2deg); box-shadow:0 8px 18px -6px rgba(0,0,0,.35); }
.sort-tip{ margin-top:8px; font-size:12.5px; color:var(--ink-faint); }

/* ---------- step 4: notes ---------- */
.notes{ margin-top:18px; display:grid; gap:14px; }
.note-card{ border:1px solid var(--surface-border); border-left:4px solid var(--c, var(--accent-2)); border-radius:5px; background:var(--ground); padding:14px; }
.note-card h3{ margin:0; font-family:'Fraunces',serif; font-size:19px; font-weight:600; }
.note-card .q{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); font-style:italic; }
.note-card .field{ margin-top:10px; }
.word-notes{ margin-top:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:8px; }
.word-note{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; }
.word-note span{ font-family:var(--term-font); font-size:13.5px; font-weight:600; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
.word-note input{ font:inherit; font-size:13px; padding:6px 8px; border-radius:3px; border:1px solid var(--surface-border); background:var(--surface); color:var(--ink); min-width:0; }
.meta-fields{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
@media(max-width:620px){ .meta-fields{ grid-template-columns:1fr; } }

/* ---------- step 5: result ---------- */
.result{ margin-top:18px; background:radial-gradient(ellipse at 30% 0%, var(--sky-2), var(--sky) 70%); color:var(--star); border-radius:8px; padding:26px 22px 22px; }
.result header{ position:static; background:none; border:none; padding:0; display:block; backdrop-filter:none; }
.result .r-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#c6a6cf; }
.result h2{ margin:6px 0 0; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,4vw,38px); color:#fff3fb; }
.result .by{ margin-top:4px; font-size:13.5px; color:#c6a6cf; }
.skies{ margin-top:20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px; }
.sky{ border:1px solid rgba(224,160,238,0.18); border-radius:6px; padding:14px 14px 12px; background:rgba(255,255,255,0.025); }
.sky h3{ margin:0; font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:#fff3fb; display:flex; gap:8px; align-items:center; }
.sky h3 .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor; }
.sky .q{ margin:3px 0 0; font-size:12.5px; font-style:italic; color:#c6a6cf; }
.sky svg{ display:block; width:100%; height:auto; margin-top:6px; overflow:visible; }
.sky svg text{ font-family:'Noto Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans Bengali','Noto Sans Devanagari','Work Sans',sans-serif; font-size:12px; fill:#f6dcf9; }
.sky svg text.wn{ font-family:'Fraunces',serif; font-style:italic; font-size:10.5px; fill:#c6a6cf; }
.sky .note{ margin:8px 0 0; font-size:13.5px; line-height:1.55; color:#eadcef; white-space:pre-line; }
.result-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:9px 14px; border-radius:4px; font-size:13px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show{ opacity:1; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<header class="bar">

  <nav class="site-nav" aria-label="Site"><a href="index.html">Atlas</a><a href="gallery.html">Gallery</a><a href="constellations.html" aria-current="page">Constellations</a><a href="submission.html">Submission</a><a href="about.html">About</a></nav>
</header>

<main>
  <div class="intro">
    <div class="eyebrow">A game of grouping</div>
    <h1>Draw your own constellation</h1>
    <p>Every word in the atlas names a place where the urban and the rural meet. Pick the words that speak to you, invent the groups that hold them together, and draw your own map of rurbanity.</p>
  </div>

  <ol class="steps" id="steps"></ol>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<div class="stepbar"><div class="inner">
  <button class="btn ghost" id="backBtn" type="button">← Back</button>
  <div class="status" id="status"></div>
  <button class="btn primary" id="nextBtn" type="button">Next →</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="entries.js"></script>
<script>
(function(){
  "use strict";
  var ENTRIES = window.GLOSSARY_ENTRIES || [];
  var BY_ID = {}; ENTRIES.forEach(function(e){ BY_ID[e.id] = e; });

  // Curated constellations from the editors' proposal, offered as inspiration in step 2.
  var CURATED = [
    { name:"Inherited Ground", q:"What was already there before urbanization arrived?" },
    { name:"Drawing the Line", q:"Who decides what counts as urban, rural, inside, outside, or even visible?" },
    { name:"Transforming / Envisioning", q:"Through what actions does land become urban?" },
    { name:"Flowing and Settling", q:"What connects places that appear to belong to separate rural and urban worlds?" },
    { name:"Making and Living the Interface", q:"How are these territories already being lived and made through everyday practice?" },
    { name:"Juxtaposing or Overlapping", q:"What if rurbanity is not an edge at all, but a condition of territory?" }
  ];
  var COLORS = ["#b34fc9","#3f8f74","#d0703c","#4f6fd0","#c2416b","#8a8a2e","#2f8fb0","#9a5cc8"];
  var MIN_WORDS = 3, MAX_WORDS = 30, MIN_GROUPS = 2, MAX_GROUPS = 8;
  var STEPS = [
    { n:"Step 1", t:"Choose your words" },
    { n:"Step 2", t:"Create groups" },
    { n:"Step 3", t:"Group your words" },
    { n:"Step 4", t:"Add notes" },
    { n:"Step 5", t:"Your constellation" }
  ];

  // ---- state (kept in this browser only, so a visitor can come back to it) ----
  var KEY = "rurbanity-constellation-game-v1";
  function fresh(){ return { step:0, picked:[], groups:[], assign:{}, wordNotes:{}, title:"", author:"" }; }
  var S = fresh();
  try{ var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if(saved && saved.picked) S = Object.assign(fresh(), saved); }catch(e){}
  S.picked = S.picked.filter(function(id){ return BY_ID[id]; });
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  var uid = 0; function gid(){ return "g" + Date.now().toString(36) + (uid++); }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function sub(e){ return e.transliteration && e.transliteration !== e.original ? e.transliteration : (e.meaning && e.meaning.length < 60 ? e.meaning : ""); }
  function groupColor(i){ return COLORS[i % COLORS.length]; }
  function namedGroups(){ return S.groups.filter(function(g){ return g.name.trim(); }); }
  function placedCount(){ return S.picked.filter(function(id){ var g = S.assign[id]; return g && S.groups.some(function(x){ return x.id === g; }); }).length; }
  function toast(msg){ var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800); }

  // ---- step gating ----
  function canEnter(i){
    if(i <= 0) return true;
    if(S.picked.length < MIN_WORDS) return false;
    if(i <= 1) return true;
    if(namedGroups().length < MIN_GROUPS) return false;
    if(i <= 2) return true;
    return placedCount() > 0;
  }
  function go(i){
    if(i < 0 || i >= STEPS.length || !canEnter(i)) return;
    if(i >= 2) S.groups = namedGroups();  // drop empty group rows once the user moves on
    S.step = i; save(); render(); window.scrollTo({ top:0, behavior:"smooth" });
  }

  var panel = document.getElementById("panel");
  var stepsEl = document.getElementById("steps");
  var statusEl = document.getElementById("status");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  backBtn.addEventListener("click", function(){ go(S.step - 1); });
  nextBtn.addEventListener("click", function(){
    if(S.step === STEPS.length - 1){ if(confirm("Start a new constellation? Your current one will be cleared.")){ S = fresh(); save(); render(); } return; }
    go(S.step + 1);
  });

  function renderSteps(){
    stepsEl.innerHTML = STEPS.map(function(s, i){
      var cur = i === S.step, done = i < S.step;
      return '<li><button type="button" data-step="'+i+'"'+(cur ? ' aria-current="step"' : '')+(canEnter(i) ? '' : ' disabled')+' class="'+(done ? 'done' : '')+'"><span class="n">'+s.n+'</span><span class="t">'+s.t+'</span></button></li>';
    }).join("");
    stepsEl.querySelectorAll("button").forEach(function(b){ b.addEventListener("click", function(){ go(+b.dataset.step); }); });
  }
  function renderBar(){
    var s = S.step, msg = "", ok = true;
    if(s === 0){
      var n = S.picked.length;
      msg = n < MIN_WORDS ? "Pick at least <b>"+MIN_WORDS+"</b> words to continue · <b>"+n+"</b> chosen" : "<b>"+n+"</b> words chosen"+(n >= MAX_WORDS ? " (maximum)" : "");
      ok = n >= MIN_WORDS;
    } else if(s === 1){
      var g = namedGroups().length;
      msg = g < MIN_GROUPS ? "Name at least <b>"+MIN_GROUPS+"</b> groups · <b>"+g+"</b> so far" : "<b>"+g+"</b> groups ready";
      ok = g >= MIN_GROUPS;
    } else if(s === 2){
      var p = placedCount();
      msg = "<b>"+p+"</b> of <b>"+S.picked.length+"</b> words placed"+(p < S.picked.length ? " · words left in the tray won’t appear in your constellation" : "");
      ok = p > 0;
    } else if(s === 3){
      msg = "Notes are optional — write as much or as little as you like";
    } else {
      msg = "Your constellation is saved in this browser";
    }
    statusEl.innerHTML = msg;
    backBtn.style.visibility = s === 0 ? "hidden" : "visible";
    nextBtn.textContent = s === STEPS.length - 1 ? "Start over" : (s === STEPS.length - 2 ? "See my constellation →" : "Next →");
    nextBtn.disabled = !ok;
  }
  function render(){
    renderSteps();
    [renderPick, renderGroups, renderSort, renderNotes, renderResult][S.step]();
    renderBar();
  }

  // ---------- step 1: choose words ----------
  var pickQuery = "", onlyPicked = false, pickLimit = 60;
  function renderPick(){
    panel.innerHTML =
      '<h2>Choose your words</h2>'+
      '<p class="guide">Browse the atlas and <b>pick the words that catch your attention</b> — ones you recognise from your own place, ones that surprise you, or ones that feel related. Choose at least '+MIN_WORDS+' (up to '+MAX_WORDS+'). Click a card to pick it; the ↗ opens the full entry.</p>'+
      '<div class="pick-tools">'+
        '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'+
        '<input id="pickSearch" type="search" placeholder="Search a word, place or contributor…" value="'+esc(pickQuery)+'" autocomplete="off"></div>'+
        '<label class="toggle"><input type="checkbox" id="onlyPicked"'+(onlyPicked ? ' checked' : '')+'> Show only my picks</label>'+
        '<button class="btn small" id="surprise" type="button">✦ Surprise me</button>'+
        (S.picked.length ? '<button class="btn small ghost" id="clearPicks" type="button">Clear picks</button>' : '')+
      '</div>'+
      '<div class="term-grid" id="termGrid"></div><div class="more-row" id="moreRow"></div>';
    var input = document.getElementById("pickSearch");
    input.addEventListener("input", function(){ pickQuery = input.value; pickLimit = 60; drawCards(); });
    document.getElementById("onlyPicked").addEventListener("change", function(e){ onlyPicked = e.target.checked; drawCards(); });
    document.getElementById("surprise").addEventListener("click", function(){
      var pool = ENTRIES.filter(function(e){ return S.picked.indexOf(e.id) === -1; });
      var room = Math.min(5, MAX_WORDS - S.picked.length);
      for(var i = 0; i < room && pool.length; i++){ S.picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id); }
      save(); onlyPicked = true; renderPick(); renderSteps(); renderBar(); toast("Added "+room+" random words");
    });
    var clr = document.getElementById("clearPicks");
    if(clr) clr.addEventListener("click", function(){ if(confirm("Remove all picked words?")){ S.picked = []; S.assign = {}; save(); render(); } });
    drawCards();
  }
  function matches(e, q){
    if(!q) return true;
    return [e.original, e.transliteration, e.meaning, e.country, e.contributor, e.where].join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function drawCards(){
    var q = pickQuery.trim().toLowerCase();
    var list = ENTRIES.filter(function(e){ return (!onlyPicked || S.picked.indexOf(e.id) !== -1) && matches(e, q); });
    var grid = document.getElementById("termGrid"), more = document.getElementById("moreRow");
    if(!list.length){ grid.innerHTML = '<div class="empty">No words match.</div>'; more.innerHTML = ""; return; }
    grid.innerHTML = list.slice(0, pickLimit).map(function(e){
      var on = S.picked.indexOf(e.id) !== -1;
      return '<button type="button" class="term-card" data-id="'+e.id+'" aria-pressed="'+on+'">'+
        '<span class="check">✓</span><span class="o">'+esc(e.original)+'</span>'+
        (sub(e) ? '<span class="tr">'+esc(sub(e))+'</span>' : '')+
        '<span class="c">'+esc(e.unlocated ? 'Non-geographic' : (e.country || ''))+'</span>'+
        '<a class="open" href="term.html?id='+e.id+'" target="_blank" rel="noopener" title="Open the full entry">↗</a></button>';
    }).join("");
    more.innerHTML = list.length > pickLimit ? '<button class="btn small" id="moreBtn" type="button">Show more ('+(list.length - pickLimit)+')</button>' : '';
    if(list.length > pickLimit) document.getElementById("moreBtn").addEventListener("click", function(){ pickLimit += 90; drawCards(); });
    grid.querySelectorAll(".term-card").forEach(function(card){
      card.addEventListener("click", function(ev){
        if(ev.target.closest(".open")) return;
        var id = +card.dataset.id, i = S.picked.indexOf(id);
        if(i === -1){
          if(S.picked.length >= MAX_WORDS){ toast("You can pick up to "+MAX_WORDS+" words"); return; }
          S.picked.push(id);
        } else { S.picked.splice(i, 1); delete S.assign[id]; delete S.wordNotes[id]; }
        card.setAttribute("aria-pressed", i === -1);
        save(); renderSteps(); renderBar();
      });
    });
  }

  // ---------- step 2: create groups ----------
  function renderGroups(){
    if(!S.groups.length){ S.groups = [{ id:gid(), name:"", q:"", note:"" }, { id:gid(), name:"", q:"", note:"" }]; }
    var used = S.groups.map(function(g){ return g.name.trim().toLowerCase(); });
    panel.innerHTML =
      '<h2>Create your groups</h2>'+
      '<p class="guide">A constellation is a group of words that belong together. <b>Name each group</b> after the idea that connects them — a shared process, a question, a feeling. Add a guiding question if it helps. You need at least '+MIN_GROUPS+' groups; you can make up to '+MAX_GROUPS+'.</p>'+
      '<div class="group-list" id="groupList">'+S.groups.map(function(g, i){
        return '<div class="group-row" data-id="'+g.id+'"><span class="dot" style="background:'+groupColor(i)+'"></span>'+
          '<div class="field"><label for="n-'+g.id+'">Group name</label><input id="n-'+g.id+'" data-k="name" value="'+esc(g.name)+'" placeholder="e.g. Ground that gets remade" maxlength="60"></div>'+
          '<div class="field q"><label for="q-'+g.id+'">Guiding question (optional)</label><input id="q-'+g.id+'" data-k="q" value="'+esc(g.q)+'" placeholder="What connects these words?" maxlength="140"></div>'+
          '<button class="icon-btn" type="button" data-del="'+g.id+'" aria-label="Remove group">×</button></div>';
      }).join("")+'</div>'+
      '<div style="margin-top:12px"><button class="btn small" id="addGroup" type="button"'+(S.groups.length >= MAX_GROUPS ? ' disabled' : '')+'>+ Add a group</button></div>'+
      '<div class="inspo"><div class="eyebrow">Need inspiration? The editors’ constellations</div><div class="chips">'+
        CURATED.map(function(c, i){ return '<button class="chip" type="button" data-c="'+i+'"'+(used.indexOf(c.name.toLowerCase()) !== -1 ? ' disabled' : '')+'>'+esc(c.name)+'<small>'+esc(c.q)+'</small></button>'; }).join("")+
      '</div></div>';
    panel.querySelectorAll(".group-row input").forEach(function(inp){
      inp.addEventListener("input", function(){
        var g = S.groups.find(function(x){ return x.id === inp.closest(".group-row").dataset.id; });
        g[inp.dataset.k] = inp.value; save(); renderSteps(); renderBar();
      });
    });
    panel.querySelectorAll("[data-del]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.dataset.del;
        S.groups = S.groups.filter(function(g){ return g.id !== id; });
        Object.keys(S.assign).forEach(function(w){ if(S.assign[w] === id) delete S.assign[w]; });
        save(); render();
      });
    });
    document.getElementById("addGroup").addEventListener("click", function(){
      S.groups.push({ id:gid(), name:"", q:"", note:"" }); save(); render();
      var rows = panel.querySelectorAll(".group-row input[data-k=name]"); rows[rows.length - 1].focus();
    });
    panel.querySelectorAll("[data-c]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = CURATED[+b.dataset.c];
        var empty = S.groups.find(function(g){ return !g.name.trim(); });
        if(empty){ empty.name = c.name; empty.q = c.q; }
        else if(S.groups.length < MAX_GROUPS){ S.groups.push({ id:gid(), name:c.name, q:c.q, note:"" }); }
        else { toast("You already have "+MAX_GROUPS+" groups"); return; }
        save(); render();
      });
    });
  }

  // ---------- step 3: sort words into groups ----------
  var selectedWord = null;
  function renderSort(){
    var tray = S.picked.filter(function(id){ return !S.assign[id] || !S.groups.some(function(g){ return g.id === S.assign[id]; }); });
    function chip(id, inGroup){
      var e = BY_ID[id];
      return '<span class="word'+(selectedWord === id ? ' selected' : '')+'" data-w="'+id+'" tabindex="0" role="button" aria-pressed="'+(selectedWord === id)+'">'+esc(e.original)+
        (inGroup ? '<button class="x" type="button" data-back="'+id+'" aria-label="Back to tray">×</button>' : '')+'</span>';
    }
    panel.innerHTML =
      '<h2>Group your words</h2>'+
      '<p class="guide"><b>Drag each word into the group where it belongs.</b> On a phone or with the keyboard: tap a word, then tap a group. Changed your mind? Drag it somewhere else, or press × to send it back to the tray.</p>'+
      '<div class="sort">'+
        '<div class="tray"><h3>Your words <span class="eyebrow" style="margin-left:auto">'+tray.length+' left</span></h3>'+
          '<div class="dropzone'+(tray.length ? '' : ' empty-hint')+'" data-drop="tray" data-hint="All words placed ✓">'+tray.map(function(id){ return chip(id, false); }).join("")+'</div></div>'+
        '<div class="buckets">'+S.groups.map(function(g, i){
          var words = S.picked.filter(function(id){ return S.assign[id] === g.id; });
          return '<div class="bucket'+(selectedWord !== null ? ' target' : '')+'" data-group="'+g.id+'">'+
            '<h3><span class="dot" style="background:'+groupColor(i)+'"></span>'+esc(g.name)+'</h3>'+(g.q ? '<p class="q">'+esc(g.q)+'</p>' : '')+
            '<div class="dropzone'+(words.length ? '' : ' empty-hint')+'" data-drop="'+g.id+'" data-hint="Drop words here">'+words.map(function(id){ return chip(id, true); }).join("")+'</div></div>';
        }).join("")+'</div>'+
      '</div>';
    wireSort();
  }
  function assignTo(wordId, target){
    if(target === "tray") delete S.assign[wordId]; else S.assign[wordId] = target;
    selectedWord = null; save(); renderSort(); renderSteps(); renderBar();
  }
  function wireSort(){
    panel.querySelectorAll("[data-back]").forEach(function(b){
      b.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      b.addEventListener("click", function(e){ e.stopPropagation(); assignTo(+b.dataset.back, "tray"); });
    });
    panel.querySelectorAll(".bucket").forEach(function(bk){
      bk.addEventListener("click", function(e){
        if(selectedWord === null || e.target.closest(".word")) return;
        assignTo(selectedWord, bk.dataset.group);
      });
    });
    panel.querySelectorAll(".word").forEach(function(w){
      w.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleSelect(+w.dataset.w); } });
      w.addEventListener("pointerdown", function(e){ startDrag(e, w); });
    });
  }
  function toggleSelect(id){ selectedWord = selectedWord === id ? null : id; renderSort(); }
  // Pointer-based drag (works for mouse, pen and touch); a press without movement counts as a tap/select.
  function startDrag(e, el){
    if(e.button !== undefined && e.button !== 0) return;
    var id = +el.dataset.w, sx = e.clientX, sy = e.clientY, ghost = null, over = null;
    el.setPointerCapture(e.pointerId);
    function move(ev){
      if(!ghost && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
      if(!ghost){ ghost = el.cloneNode(true); ghost.classList.add("drag-ghost"); document.body.appendChild(ghost); el.classList.add("dragging"); }
      ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      var dz = hit && (hit.closest(".dropzone") || (hit.closest(".bucket") && hit.closest(".bucket").querySelector(".dropzone")));
      if(over !== dz){ if(over) over.classList.remove("over"); over = dz; if(over) over.classList.add("over"); }
      // keep the page scrolling when dragging near the screen edges
      if(ev.clientY > window.innerHeight - 80) window.scrollBy(0, 12); else if(ev.clientY < 90) window.scrollBy(0, -12);
    }
    function up(){
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      if(ghost){ ghost.remove(); el.classList.remove("dragging"); if(over){ over.classList.remove("over"); assignTo(id, over.dataset.drop); } }
      else toggleSelect(id);
    }
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  }

  // ---------- step 4: notes ----------
  function renderNotes(){
    panel.innerHTML =
      '<h2>Add your notes</h2>'+
      '<p class="guide">Tell us <b>why these words belong together</b>. A sentence for each group is enough. You can also add a short note to any word — a verb, a hint, what it does in the group (e.g. “remakes the ground”, “labour circulates”).</p>'+
      '<div class="meta-fields">'+
        '<div class="field"><label for="cTitle">Title of your constellation (optional)</label><input id="cTitle" maxlength="80" value="'+esc(S.title)+'" placeholder="e.g. Edges that move"></div>'+
        '<div class="field"><label for="cAuthor">Your name (optional)</label><input id="cAuthor" maxlength="80" value="'+esc(S.author)+'" placeholder="Shown on your constellation"></div>'+
      '</div>'+
      '<div class="notes">'+S.groups.map(function(g, i){
        var words = S.picked.filter(function(id){ return S.assign[id] === g.id; });
        if(!words.length) return "";
        return '<div class="note-card" style="--c:'+groupColor(i)+'"><h3>'+esc(g.name)+'</h3>'+(g.q ? '<p class="q">'+esc(g.q)+'</p>' : '')+
          '<div class="field"><label for="gn-'+g.id+'">Why do these words belong together?</label><textarea id="gn-'+g.id+'" data-gnote="'+g.id+'" maxlength="600" placeholder="Write a note for this group…">'+esc(g.note || "")+'</textarea></div>'+
          '<div class="word-notes">'+words.map(function(id){
            return '<label class="word-note"><span title="'+esc(BY_ID[id].original)+'">'+esc(BY_ID[id].original)+'</span><input data-wnote="'+id+'" maxlength="80" value="'+esc(S.wordNotes[id] || "")+'" placeholder="short note (optional)"></label>';
          }).join("")+'</div></div>';
      }).join("")+'</div>';
    document.getElementById("cTitle").addEventListener("input", function(e){ S.title = e.target.value; save(); });
    document.getElementById("cAuthor").addEventListener("input", function(e){ S.author = e.target.value; save(); });
    panel.querySelectorAll("[data-gnote]").forEach(function(t){
      t.addEventListener("input", function(){ S.groups.find(function(g){ return g.id === t.dataset.gnote; }).note = t.value; save(); });
    });
    panel.querySelectorAll("[data-wnote]").forEach(function(t){
      t.addEventListener("input", function(){ S.wordNotes[t.dataset.wnote] = t.value; save(); });
    });
  }

  // ---------- step 5: the constellation ----------
  // Deterministic pseudo-random so each group keeps the same star layout between visits.
  function rng(seed){ var h = 2166136261; for(var i = 0; i < seed.length; i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
  function layout(n, seed){
    var r = rng(seed), pts = [], W = 360, H = n > 6 ? 300 : 230, tries = 0;
    while(pts.length < n && tries < 4000){
      tries++;
      var p = { x: 40 + r() * (W - 80), y: 28 + r() * (H - 60) };
      if(pts.every(function(q){ return Math.hypot(p.x - q.x, (p.y - q.y) * 1.6) > 70 - Math.min(tries / 120, 40); })) pts.push(p);
    }
    // join stars with a minimum spanning tree, like the lines of a constellation
    var edges = [], inTree = [0];
    while(inTree.length < pts.length){
      var best = null;
      inTree.forEach(function(a){ pts.forEach(function(q, b){ if(inTree.indexOf(b) !== -1) return; var d = Math.hypot(pts[a].x - q.x, pts[a].y - q.y); if(!best || d < best.d) best = { a:a, b:b, d:d }; }); });
      edges.push(best); inTree.push(best.b);
    }
    return { pts:pts, edges:edges, W:W, H:H, r:r };
  }
  function renderResult(){
    var groups = S.groups.map(function(g, i){ return { g:g, i:i, words:S.picked.filter(function(id){ return S.assign[id] === g.id; }) }; }).filter(function(x){ return x.words.length; });
    panel.innerHTML =
      '<h2>Your constellation</h2>'+
      '<p class="guide">Here is your map of rurbanity. Each group is drawn as a constellation: <b>every star is a word</b>, linked to its nearest neighbours. Save it as an image to share, or go back to any step to keep refining it.</p>'+
      '<div class="result" id="result">'+
        '<div class="r-eyebrow">A constellation from the Glossary of Rurbanity</div>'+
        '<h2>'+esc(S.title.trim() || "My constellation of rurbanity")+'</h2>'+
        (S.author.trim() ? '<div class="by">by '+esc(S.author.trim())+'</div>' : '')+
        '<div class="skies">'+groups.map(function(x){
          var L = layout(x.words.length, x.g.id + x.g.name), color = groupColor(x.i);
          var lines = L.edges.map(function(e){ var a = L.pts[e.a], b = L.pts[e.b]; return '<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" stroke="'+color+'" stroke-opacity=".55" stroke-width="1.2"/>'; }).join("");
          var dust = ""; for(var d = 0; d < 26; d++){ dust += '<circle cx="'+(L.r() * L.W).toFixed(1)+'" cy="'+(L.r() * L.H).toFixed(1)+'" r="'+(0.4 + L.r() * 0.8).toFixed(2)+'" fill="#f6dcf9" opacity="'+(0.15 + L.r() * 0.35).toFixed(2)+'"/>'; }
          var stars = x.words.map(function(id, k){
            var p = L.pts[k], e = BY_ID[id], note = (S.wordNotes[id] || "").trim(), anchor = p.x > L.W * 0.7 ? "end" : (p.x < L.W * 0.3 ? "start" : "middle");
            var dx = anchor === "end" ? -9 : (anchor === "start" ? 9 : 0);
            return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="7" fill="'+color+'" opacity=".22"/>'+
              '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="#fff3fb"/>'+
              '<a href="term.html?id='+id+'" target="_blank"><text x="'+(p.x + dx).toFixed(1)+'" y="'+(p.y - 10).toFixed(1)+'" text-anchor="'+anchor+'">'+esc(e.original)+'</text></a>'+
              (note ? '<text class="wn" x="'+(p.x + dx).toFixed(1)+'" y="'+(p.y + 18).toFixed(1)+'" text-anchor="'+anchor+'">'+esc(note)+'</text>' : '');
          }).join("");
          return '<div class="sky"><h3><span class="dot" style="background:'+color+';color:'+color+'"></span>'+esc(x.g.name)+'</h3>'+(x.g.q ? '<p class="q">'+esc(x.g.q)+'</p>' : '')+
            '<svg viewBox="0 0 '+L.W+' '+L.H+'" role="img" aria-label="'+esc(x.g.name)+': '+esc(x.words.map(function(id){ return BY_ID[id].original; }).join(", "))+'">'+dust+lines+stars+'</svg>'+
            (x.g.note && x.g.note.trim() ? '<p class="note">'+esc(x.g.note.trim())+'</p>' : '')+'</div>';
        }).join("")+'</div>'+
      '</div>'+
      '<div class="result-actions">'+
        '<button class="btn primary" id="saveImg" type="button">Save as image</button>'+
        '<button class="btn" id="copyText" type="button">Copy as text</button>'+
        '<button class="btn ghost" id="editGroups" type="button">Edit groups</button>'+
      '</div>';
    document.getElementById("editGroups").addEventListener("click", function(){ go(2); });
    document.getElementById("copyText").addEventListener("click", function(){
      var t = (S.title.trim() || "My constellation of rurbanity") + (S.author.trim() ? " — " + S.author.trim() : "") + "\n";
      groups.forEach(function(x){
        t += "\n" + x.g.name + (x.g.q ? " (" + x.g.q + ")" : "") + "\n";
        x.words.forEach(function(id){ t += "  · " + BY_ID[id].original + (S.wordNotes[id] ? " — " + S.wordNotes[id] : "") + "\n"; });
        if(x.g.note && x.g.note.trim()) t += "  " + x.g.note.trim() + "\n";
      });
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast("Copied to clipboard"); }, function(){ toast("Couldn’t copy — please select the text manually"); });
    });
    document.getElementById("saveImg").addEventListener("click", saveImage);
  }
  function saveImage(){
    var node = document.getElementById("result");
    function run(){
      window.html2canvas(node, { backgroundColor:null, scale:2, useCORS:true }).then(function(canvas){
        var a = document.createElement("a");
        a.download = (S.title.trim() || "my-constellation").replace(/[^\w\-]+/g, "-").toLowerCase() + ".png";
        a.href = canvas.toDataURL("image/png"); a.click();
      }, function(){ toast("Couldn’t create the image"); });
    }
    if(window.html2canvas) return run();
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = run; s.onerror = function(){ toast("Couldn’t load the image tool"); };
    document.head.appendChild(s);
  }

  render();
})();
</script>
</body>
</html>
